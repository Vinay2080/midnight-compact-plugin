name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin Version (e.g. 1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, Publish & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Plugin Version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Target version: ${VERSION}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Run Unit Tests
        run: ./gradlew test -Pversion=${VERSION}

      - name: Verify Plugin Structure
        run: ./gradlew verifyPluginStructure -Pversion=${VERSION}

      - name: Build Distribution ZIP
        run: ./gradlew buildPlugin -Pversion=${VERSION}

      - name: Publish to JetBrains Marketplace
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${PUBLISH_TOKEN}" ]; then
            echo "Publishing plugin to JetBrains Marketplace..."
            ./gradlew publishPlugin -Pversion=${VERSION}
          else
            echo "::warning ::PUBLISH_TOKEN is not set in repository secrets. Skipping JetBrains Marketplace publish."
          fi

      - name: Create GitHub Release and Attach Plugin ZIP
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "${TAG_NAME}" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG_NAME="v${VERSION}"
          fi

          echo "Creating GitHub release for tag ${TAG_NAME}..."
          gh release create "${TAG_NAME}" build/distributions/*.zip \
            --title "Midnight Plugin v${VERSION}" \
            --generate-notes
