architecture:
  lexer:
    implementation: dev.verloren.midnight.lexer.CompactLexer
    base_class: com.intellij.lexer.LexerBase
    token_types: dev.verloren.midnight.lexer.CompactTokenTypes
  parser:
    implementation: dev.verloren.midnight.parser.CompactParser
    base_interface: com.intellij.lang.PsiParser
    definition: dev.verloren.midnight.parser.CompactParserDefinition
    element_types: dev.verloren.midnight.psi.CompactElementTypes
  psi:
    base_element: dev.verloren.midnight.psi.impl.CompactPsiElement
    named_element: dev.verloren.midnight.psi.impl.CompactNamedElementImpl
    factory: dev.verloren.midnight.psi.impl.CompactElementFactory
  references_and_resolve:
    resolver: dev.verloren.midnight.resolve.CompactResolveUtil
    scope_processor: dev.verloren.midnight.resolve.CompactScopeProcessor
    namespace_model: Split TYPE and VALUE namespaces with innermost lexical shadowing
  type_system:
    interface: dev.verloren.midnight.type.CompactType
    primitives: dev.verloren.midnight.type.CompactPrimitiveType
    nominal_types: dev.verloren.midnight.type.CompactNamedType
    inference_util: dev.verloren.midnight.type.CompactTypeInferenceUtil
  inspections:
    unresolved_reference: dev.verloren.midnight.inspection.CompactUnresolvedReferenceInspection
    duplicate_declaration: dev.verloren.midnight.inspection.CompactDuplicateDeclarationInspection
    unused_local_variable: dev.verloren.midnight.inspection.CompactUnusedLocalVariableInspection
    type_mismatch: dev.verloren.midnight.inspection.CompactTypeMismatchInspection
  formatter:
    model_builder: dev.verloren.midnight.formatter.CompactFormattingModelBuilder
    block: dev.verloren.midnight.formatter.CompactBlock
    settings_provider: dev.verloren.midnight.formatter.CompactLanguageCodeStyleSettingsProvider
